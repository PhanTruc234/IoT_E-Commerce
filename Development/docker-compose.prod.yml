# Dùng trên VPS: chỉ kéo image đã build sẵn từ GHCR về chạy, không build
# GitHub Actions tự chép file này lên /opt/iotech và truyền IMAGE_PREFIX
name: iotech

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    image: ${IMAGE_PREFIX:-ghcr.io/phantruc234}/iotech-backend:latest
    env_file:
      - ./backend.env
    ports:
      - "127.0.0.1:3001:3001"
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    image: ${IMAGE_PREFIX:-ghcr.io/phantruc234}/iotech-frontend:latest
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    logging: *logging
    depends_on:
      - backend
