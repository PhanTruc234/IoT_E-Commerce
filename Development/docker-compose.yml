name: iotech

services:
  backend:
    build:
      context: ../Source/backend
      dockerfile: ../../Development/docker/backend.Dockerfile
    env_file:
      - ./env/backend.env
    ports:
      - "3001:3001"
    restart: always
    healthcheck:
      test:
        ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/products?limit=1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ../Source/frontend
      dockerfile: ../../Development/docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
    ports:
      - "3000:3000"
    restart: always
    depends_on:
      - backend
